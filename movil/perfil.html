<html lang="es">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>CityFix AI - Mi Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
    <style>
        .toast-message {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: white;
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 0.8rem;
            z-index: 9999;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fas fa-home"></i><span>Inicio</span></a>
        <a href="reportar.html" class="nav-item"><i class="fas fa-plus-circle"></i><span>Reportar</span></a>
        <a href="basura.php" class="nav-item"><i class="fas fa-trash-alt"></i><span>Basura</span></a>
        <a href="mis-reportes.html" class="nav-item"><i class="fas fa-list"></i><span>Mis Reportes</span></a>
        <a href="perfil.html" class="nav-item active"><i class="fas fa-user"></i><span>Perfil</span></a>
    </div>

    <div class="main-content pb-5">
        <div class="header-gradient p-4 text-white">
            <h1 class="h4 fw-bold mb-0"><i class="fas fa-user-circle me-2"></i>Mi Perfil</h1>
        </div>

        <div class="px-3 mt-3">
            <div class="card-mobile text-center mb-3">
                <div class="profile-avatar mx-auto mb-3">
                    <i class="fas fa-user-circle fa-4x text-primary"></i>
                </div>
                <h4 id="displayNombre" class="fw-bold">Cargando...</h4>
                <p id="displayEmail" class="text-muted small">Cargando...</p>
                <button class="btn btn-outline-danger btn-sm" onclick="cerrarSesion()">
                    <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
                </button>
            </div>

            <div class="card-mobile mb-3">
                <div class="d-flex justify-content-between align-items-center py-2 border-bottom" onclick="editarPerfil()">
                    <span><i class="fas fa-user me-3 text-primary"></i> Editar perfil</span>
                    <i class="fas fa-chevron-right text-muted"></i>
                </div>
                <div class="d-flex justify-content-between align-items-center py-2 border-bottom" onclick="cambiarPassword()">
                    <span><i class="fas fa-lock me-3 text-primary"></i> Cambiar contraseña</span>
                    <i class="fas fa-chevron-right text-muted"></i>
                </div>
                <div class="d-flex justify-content-between align-items-center py-2" onclick="mostrarInfo()">
                    <span><i class="fas fa-info-circle me-3 text-primary"></i> Acerca de CityFix AI</span>
                    <i class="fas fa-chevron-right text-muted"></i>
                </div>
            </div>

            <div class="card-mobile mb-3">
                <div class="d-flex justify-content-between align-items-center py-2">
                    <span><i class="fas fa-bell me-3 text-primary"></i> Notificaciones</span>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="notificacionesSwitch" onchange="toggleNotificaciones(this)">
                    </div>
                </div>
                <div class="d-flex justify-content-between align-items-center py-2">
                    <span><i class="fas fa-moon me-3 text-primary"></i> Modo oscuro</span>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="darkModeSwitch" onchange="toggleDarkMode(this)">
                    </div>
                </div>
            </div>

            <div class="card-mobile">
                <div class="text-center">
                    <img src="https://via.placeholder.com/80x80?text=CityFix" class="rounded-circle mb-2" width="60">
                    <p class="small text-muted">Versión 1.0.0</p>
                    <p class="small text-muted">© 2024 CityFix AI - Mejorando tu ciudad</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        function cargarPerfil() {
            // Primero intentar obtener de localStorage
            let nombre = localStorage.getItem('usuarioNombre');
            let email = localStorage.getItem('usuarioEmail');
            
            if(nombre && email) {
                $('#displayNombre').text(nombre);
                $('#displayEmail').text(email);
            } else {
                // Si no hay datos en localStorage, obtener de la sesión PHP
                $.ajax({
                    url: '../api/get_session.php',
                    type: 'GET',
                    dataType: 'json',
                    success: function(data) {
                        if(data.success && data.usuario) {
                            $('#displayNombre').text(data.usuario.nombre);
                            $('#displayEmail').text(data.usuario.email);
                            // Guardar en localStorage para futuras visitas
                            localStorage.setItem('usuarioId', data.usuario.id);
                            localStorage.setItem('usuarioNombre', data.usuario.nombre);
                            localStorage.setItem('usuarioEmail', data.usuario.email);
                        } else {
                            $('#displayNombre').html('<span class="text-danger">No has iniciado sesión</span>');
                            $('#displayEmail').html('<a href="login.php" class="text-primary">Iniciar sesión</a>');
                        }
                    },
                    error: function() {
                        $('#displayNombre').html('<span class="text-danger">Error de conexión</span>');
                        $('#displayEmail').html('<a href="login.php" class="text-primary">Iniciar sesión</a>');
                    }
                });
            }
            
            // Cargar preferencias
            const notificaciones = localStorage.getItem('notificaciones') === 'true';
            $('#notificacionesSwitch').prop('checked', notificaciones);
            
            const darkMode = localStorage.getItem('darkMode') === 'true';
            $('#darkModeSwitch').prop('checked', darkMode);
            if(darkMode) $('body').addClass('dark-mode');
        }

        function cerrarSesion() {
            if(confirm('¿Estás seguro de que deseas cerrar sesión?')) {
                localStorage.removeItem('usuarioId');
                localStorage.removeItem('usuarioNombre');
                localStorage.removeItem('usuarioEmail');
                localStorage.removeItem('usuarioToken');
                localStorage.removeItem('basura_suscripcion_movil');
                localStorage.removeItem('notificaciones');
                localStorage.removeItem('darkMode');
                
                window.location.href = 'logout.php';
            }
        }

        function editarPerfil() {
            const nuevoNombre = prompt('Ingresa tu nombre:', $('#displayNombre').text());
            if(nuevoNombre && nuevoNombre !== 'Cargando...' && nuevoNombre !== 'No has iniciado sesión') {
                localStorage.setItem('usuarioNombre', nuevoNombre);
                cargarPerfil();
                mostrarToast('Perfil actualizado');
            }
        }

        function cambiarPassword() {
            alert('Funcionalidad en desarrollo.');
        }

        function mostrarInfo() {
            alert('CityFix AI\nVersión 1.0.0\n\nPlataforma para reportar problemas urbanos y mejorar tu ciudad.');
        }

        function toggleNotificaciones(sw) {
            localStorage.setItem('notificaciones', sw.checked);
            mostrarToast(sw.checked ? 'Notificaciones activadas' : 'Notificaciones desactivadas');
        }

        function toggleDarkMode(sw) {
            localStorage.setItem('darkMode', sw.checked);
            if(sw.checked) $('body').addClass('dark-mode');
            else $('body').removeClass('dark-mode');
            mostrarToast(sw.checked ? 'Modo oscuro activado' : 'Modo claro activado');
        }

        function mostrarToast(msg) {
            const toast = $('<div>').addClass('toast-message').text(msg);
            $('body').append(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        $(document).ready(cargarPerfil);
    </script>
</body>
</html>
