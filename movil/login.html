<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#10b981">
    <title>CityFix AI - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
    <style>
        body { background: #f0fdf4; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .logo-container { text-align: center; padding: 40px 20px 20px; }
        .logo-icon { width: 80px; height: 80px; background: linear-gradient(135deg, #10b981, #059669); border-radius: 25px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
        .logo-icon i { font-size: 40px; color: white; }
        .auth-card { background: white; border-radius: 30px; padding: 30px 25px; margin: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .form-control-custom { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 16px; padding: 14px 16px; font-size: 1rem; width: 100%; margin-bottom: 15px; }
        .btn-login { background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; border-radius: 40px; padding: 14px; font-weight: 600; width: 100%; font-size: 1rem; }
        .link-register { text-align: center; margin-top: 20px; color: #64748b; }
        .link-register a { color: #10b981; text-decoration: none; font-weight: 600; }
        .error-msg { color: #ef4444; font-size: 0.8rem; margin-top: -10px; margin-bottom: 10px; display: none; }
        .custom-toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 10px 20px; border-radius: 40px; font-size: 0.8rem; z-index: 2000; white-space: nowrap; }
    </style>
</head>
<body>
    <div class="logo-container">
        <div class="logo-icon">
            <i class="fas fa-city"></i>
        </div>
        <h2 class="fw-bold" style="color: #1e293b;">CityFix AI</h2>
        <p class="text-muted">Bienvenido de vuelta</p>
    </div>

    <div class="auth-card">
        <form id="loginForm">
            <div class="mb-2">
                <input type="email" id="email" class="form-control-custom" placeholder="Correo electrónico" required>
            </div>
            <div class="mb-2">
                <input type="password" id="password" class="form-control-custom" placeholder="Contraseña" required>
            </div>
            <div id="loginError" class="error-msg"></div>
            <button type="submit" class="btn-login mt-2">
                <i class="fas fa-arrow-right-to-bracket me-2"></i>Iniciar Sesión
            </button>
        </form>
        <div class="link-register">
            ¿No tienes cuenta? <a href="register.html">Regístrate aquí</a>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $('#loginForm').on('submit', function(e) {
            e.preventDefault();
            
            const email = $('#email').val().trim();
            const password = $('#password').val();
            
            if(!email || !password) {
                mostrarError('Completa todos los campos');
                return;
            }
            
            $.ajax({
                url: '../api/auth.php',
                type: 'POST',
                data: { action: 'login', email: email, password: password },
                dataType: 'json',
                success: function(data) {
                    if(data.success) {
                        localStorage.setItem('usuarioId', data.usuario.id);
                        localStorage.setItem('usuarioNombre', data.usuario.nombre);
                        localStorage.setItem('usuarioEmail', data.usuario.email);
                        localStorage.setItem('usuarioToken', data.token);
                        mostrarToast('✅ ¡Bienvenido ' + data.usuario.nombre + '!');
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 1000);
                    } else {
                        mostrarError(data.error || 'Error al iniciar sesión');
                    }
                },
                error: function() {
                    mostrarError('Error de conexión');
                }
            });
        });
        
        function mostrarError(msg) {
            $('#loginError').text(msg).show();
            setTimeout(() => $('#loginError').fadeOut(), 3000);
        }
        
        function mostrarToast(msg) {
            const toast = $(`<div class="custom-toast">${msg}</div>`);
            $('body').append(toast);
            setTimeout(() => toast.remove(), 2000);
        }
    </script>
</body>
</html>
