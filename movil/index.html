</head>
<body>
    <div class="bottom-nav">
        <a href="index.html" class="nav-item active">
            <i class="fas fa-home"></i>
            <span>Inicio</span>
        </a>
        <a href="reportar.html" class="nav-item">
            <i class="fas fa-plus-circle"></i>
            <span>Reportar</span>
        </a>
        <a href="basura.php" class="nav-item">
            <i class="fas fa-trash-alt"></i>
            <span>Basura</span>
        </a>
        <a href="mis-reportes.html" class="nav-item">
            <i class="fas fa-list"></i>
            <span>Mis Reportes</span>
        </a>
        <a href="perfil.html" class="nav-item">
            <i class="fas fa-user"></i>
            <span>Perfil</span>
        </a>
    </div>

    <div class="main-content pb-5">
        <div class="header-gradient p-4 text-white">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h1 class="h3 fw-bold">CityFix AI</h1>
                    <p class="small opacity-75">Reporta problemas en tu ciudad</p>
                </div>
                <div class="text-end">
                    <i class="fas fa-bell fs-4"></i>
                </div>
            </div>
        </div>

        <div class="px-3 mt-3">
            <div class="row g-3 mb-4">
                <div class="col-6">
                    <div class="stat-card-mini" id="totalReportesCard">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <small class="text-muted">Mis Reportes</small>
                                <h3 class="mb-0 fw-bold" id="totalReportes">0</h3>
                            </div>
                            <i class="fas fa-flag-checkered fs-1 text-primary opacity-50"></i>
                        </div>
                    </div>
                </div>
                <div class="col-6">
                    <div class="stat-card-mini" id="resueltosCard">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <small class="text-muted">Resueltos</small>
                                <h3 class="mb-0 fw-bold text-success" id="totalResueltos">0</h3>
                            </div>
                            <i class="fas fa-check-circle fs-1 text-success opacity-50"></i>
                        </div>
                    </div>
                </div>
            </div>

            <div class="quick-report-card mb-4" onclick="window.location.href='reportar.html'">
                <div class="d-flex align-items-center justify-content-between">
                    <div>
                        <i class="fas fa-camera me-2 fs-4"></i>
                        <span class="fw-bold">Reportar un problema</span>
                    </div>
                    <i class="fas fa-arrow-right"></i>
                </div>
            </div>

            <div class="section-title mb-3">
                <h5 class="fw-bold mb-0"><i class="fas fa-clock me-2 text-primary"></i>Reportes Recientes</h5>
            </div>

            <div id="recentReports">
                <div class="text-center py-4">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2 text-muted">Cargando reportes...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/app.js"></script>
    
    <script>
        let usuarioGlobal = null;

        function obtenerUsuarioDesdeSesion() {
            return new Promise((resolve, reject) => {
                $.ajax({
                    url: '../api/get_usuario.php',
                    type: 'GET',
                    dataType: 'json',
                    success: function(data) {
                        if(data.success) {
                            usuarioGlobal = data.usuario;
                            localStorage.setItem('usuarioId', data.usuario.id);
                            localStorage.setItem('usuarioNombre', data.usuario.nombre);
                            localStorage.setItem('usuarioEmail', data.usuario.email);
                            resolve(data.usuario);
                        } else {
                            window.location.href = 'login.php';
                            reject();
                        }
                    },
                    error: function() {
                        window.location.href = 'login.php';
                        reject();
                    }
                });
            });
        }

        function cargarEstadisticas() {
            const usuarioId = localStorage.getItem('usuarioId');
            if(!usuarioId) return;
            
            $.ajax({
                url: '../api/movil_stats.php',
                type: 'GET',
                data: { usuario_id: usuarioId },
                dataType: 'json',
                success: function(data) {
                    if(data.success) {
                        $('#totalReportes').text(data.total);
                        $('#totalResueltos').text(data.resueltos);
                    }
                }
            });
        }

        function cargarReportesRecientes() {
            const usuarioId = localStorage.getItem('usuarioId');
            if(!usuarioId) return;
            
            $.ajax({
                url: '../api/movil_reports.php',
                type: 'GET',
                data: { usuario_id: usuarioId, action: 'recientes' },
                dataType: 'json',
                success: function(data) {
                    if(data.success && data.reportes.length > 0) {
                        let html = '';
                        data.reportes.forEach(r => {
                            const estadoClass = r.estado == 'resuelto' ? 'bg-success' : (r.estado == 'en_proceso' ? 'bg-info' : 'bg-warning');
                            const estadoText = r.estado == 'resuelto' ? 'Resuelto' : (r.estado == 'en_proceso' ? 'En proceso' : 'Pendiente');
                            html += `
                                <div class="report-card" onclick="verDetalle(${r.id})">
                                    <div class="d-flex justify-content-between align-items-start">
                                        <div class="flex-grow-1">
                                            <h6 class="fw-bold mb-1">${escapeHtml(r.titulo)}</h6>
                                            <p class="small text-muted mb-2">${escapeHtml(r.descripcion.substring(0, 80))}${r.descripcion.length > 80 ? '...' : ''}</p>
                                            <div class="d-flex gap-2">
                                                <span class="badge ${r.prioridad == 'alta' ? 'bg-danger' : (r.prioridad == 'media' ? 'bg-warning' : 'bg-success')}">${r.prioridad.toUpperCase()}</span>
                                                <span class="badge ${estadoClass}">${estadoText}</span>
                                            </div>
                                            <small class="text-muted d-block mt-2"><i class="far fa-calendar-alt"></i> ${new Date(r.fecha_reporte).toLocaleDateString()}</small>
                                        </div>
                                        <div class="ms-3">
                                            <div class="status-indicator ${r.estado}"></div>
                                        </div>
                                    </div>
                                </div>
                            `;
                        });
                        $('#recentReports').html(html);
                    } else {
                        $('#recentReports').html(`
                            <div class="empty-state text-center py-5">
                                <i class="fas fa-inbox fa-3x text-muted mb-3"></i>
                                <p class="text-muted">No has realizado reportes aún</p>
                                <button class="btn btn-primary mt-2" onclick="window.location.href='reportar.html'">Reportar ahora</button>
                            </div>
                        `);
                    }
                },
                error: function() {
                    $('#recentReports').html(`<div class="alert alert-danger">Error al cargar los reportes</div>`);
                }
            });
        }

        function verDetalle(id) {
            window.location.href = `detalle.html?id=${id}`;
        }

        function escapeHtml(text) {
            if(!text) return '';
            return $('<div>').text(text).html();
        }

        $(document).ready(function() {
            obtenerUsuarioDesdeSesion().then(() => {
                cargarEstadisticas();
                cargarReportesRecientes();
            });
        });
    </script>
</body>
</html>
