<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#10b981">
    <title>CityFix AI - Crear Cuenta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
    <style>
        body { background: #f0fdf4; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .logo-container { text-align: center; padding: 30px 20px 10px; }
        .logo-icon { width: 70px; height: 70px; background: linear-gradient(135deg, #10b981, #059669); border-radius: 25px; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; }
        .logo-icon i { font-size: 35px; color: white; }
        .auth-card { background: white; border-radius: 30px; padding: 25px; margin: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .form-control-custom { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 16px; padding: 12px 16px; font-size: 0.95rem; width: 100%; margin-bottom: 12px; }
        .btn-register { background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; border-radius: 40px; padding: 12px; font-weight: 600; width: 100%; font-size: 1rem; }
        .link-login { text-align: center; margin-top: 15px; color: #64748b; }
        .link-login a { color: #10b981; text-decoration: none; font-weight: 600; }
        .error-msg { color: #ef4444; font-size: 0.75rem; margin-top: -8px; margin-bottom: 8px; display: none; }
        .custom-toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 10px 20px; border-radius: 40px; font-size: 0.8rem; z-index: 2000; }
    </style>
</head>
<body>
    <div class="logo-container">
        <div class="logo-icon">
            <i class="fas fa-user-plus"></i>
        </div>
        <h3 class="fw-bold" style="color: #1e293b;">Crear Cuenta</h3>
        <p class="text-muted small">Regístrate para recibir notificaciones</p>
    </div>

    <div class="auth-card">
        <form id="registerForm">
            <input type="text" id="nombre" class="form-control-custom" placeholder="Nombre completo *" required>
            <input type="email" id="email" class="form-control-custom" placeholder="Correo electrónico *" required>
            <input type="tel" id="telefono" class="form-control-custom" placeholder="Teléfono (opcional)">
            <input type="password" id="password" class="form-control-custom" placeholder="Contraseña *" required>
            <input type="password" id="confirm_password" class="form-control-custom" placeholder="Confirmar contraseña *" required>
            <div id="registerError" class="error-msg"></div>
            <button type="submit" class="btn-register mt-2">
                <i class="fas fa-user-plus me-2"></i>Registrarme
            </button>
        </form>
        <div class="link-login">
            ¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $('#registerForm').on('submit', function(e) {
            e.preventDefault();
            
            const nombre = $('#nombre').val().trim();
            const email = $('#email').val().trim();
            const telefono = $('#telefono').val().trim();
            const password = $('#password').val();
            const confirm_password = $('#confirm_password').val();
            
            if(!nombre || !email || !password) {
                mostrarError('Completa los campos obligatorios');
                return;
            }
            
            if(password !== confirm_password) {
                mostrarError('Las contraseñas no coinciden');
                return;
            }
            
            if(password.length < 6) {
                mostrarError('La contraseña debe tener al menos 6 caracteres');
                return;
            }
            
            $.ajax({
                url: '../api/auth.php',
                type: 'POST',
                data: { 
                    action: 'register', 
                    nombre: nombre, 
                    email: email, 
                    telefono: telefono, 
                    password: password 
                },
                dataType: 'json',
                success: function(data) {
                    if(data.success) {
                        mostrarToast('✅ ¡Registro exitoso! Ahora inicia sesión');
                        setTimeout(() => {
                            window.location.href = 'login.html';
                        }, 1500);
                    } else {
                        mostrarError(data.error || 'Error al registrarse');
                    }
                },
                error: function() {
                    mostrarError('Error de conexión');
                }
            });
        });
        
        function mostrarError(msg) {
            $('#registerError').text(msg).show();
            setTimeout(() => $('#registerError').fadeOut(), 3000);
        }
        
        function mostrarToast(msg) {
            const toast = $(`<div class="custom-toast">${msg}</div>`);
            $('body').append(toast);
            setTimeout(() => toast.remove(), 2000);
        }
    </script>
</body>
</html>
