<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>CityFix AI - Mis Reportes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <div class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fas fa-home"></i><span>Inicio</span></a>
        <a href="reportar.html" class="nav-item"><i class="fas fa-plus-circle"></i><span>Reportar</span></a>
        <a href="basura.php" class="nav-item"><i class="fas fa-trash-alt"></i><span>Basura</span></a>
        <a href="mis-reportes.html" class="nav-item active"><i class="fas fa-list"></i><span>Mis Reportes</span></a>
        <a href="perfil.html" class="nav-item"><i class="fas fa-user"></i><span>Perfil</span></a>
    </div>

    <div class="main-content pb-5">
        <div class="header-gradient p-4 text-white">
            <div class="d-flex align-items-center">
                <a href="index.html" class="text-white me-3"><i class="fas fa-arrow-left fs-5"></i></a>
                <h1 class="h4 fw-bold mb-0">Mis Reportes</h1>
            </div>
        </div>

        <div class="px-3 mt-3">
            <!-- Filtros -->
            <div class="filter-tabs mb-3">
                <button class="filter-tab active" data-filtro="todos" onclick="filtrarReportes('todos')">Todos</button>
                <button class="filter-tab" data-filtro="pendiente" onclick="filtrarReportes('pendiente')">Pendientes</button>
                <button class="filter-tab" data-filtro="en_proceso" onclick="filtrarReportes('en_proceso')">En Proceso</button>
                <button class="filter-tab" data-filtro="resuelto" onclick="filtrarReportes('resuelto')">Resueltos</button>
            </div>

            <!-- Lista de reportes -->
            <div id="misReportes">
                <div class="text-center py-4">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2 text-muted">Cargando tus reportes...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        let reportesData = [];

        function cargarMisReportes() {
            const usuarioId = localStorage.getItem('usuarioId') || 'guest';
            $.ajax({
                url: '../api/movil_reports.php',
                type: 'GET',
                data: { usuario_id: usuarioId, action: 'todos' },
                dataType: 'json',
                success: function(data) {
                    if(data.success) {
                        reportesData = data.reportes;
                        mostrarReportes(reportesData);
                    } else {
                        $('#misReportes').html(`
                            <div class="empty-state text-center py-5">
                                <i class="fas fa-inbox fa-3x text-muted mb-3"></i>
                                <p class="text-muted">No tienes reportes aún</p>
                                <button class="btn btn-primary mt-2" onclick="window.location.href='reportar.html'">Crear mi primer reporte</button>
                            </div>
                        `);
                    }
                }
            });
        }

        function mostrarReportes(reportes) {
            if(reportes.length === 0) {
                $('#misReportes').html(`
                    <div class="empty-state text-center py-5">
                        <i class="fas fa-filter fa-3x text-muted mb-3"></i>
                        <p class="text-muted">No hay reportes con este filtro</p>
                    </div>
                `);
                return;
            }

            let html = '';
            reportes.forEach(r => {
                const estadoClass = r.estado == 'resuelto' ? 'bg-success' : (r.estado == 'en_proceso' ? 'bg-info' : 'bg-warning');
                const estadoText = r.estado == 'resuelto' ? 'Resuelto' : (r.estado == 'en_proceso' ? 'En proceso' : 'Pendiente');
                const prioridadClass = r.prioridad == 'alta' ? 'bg-danger' : (r.prioridad == 'media' ? 'bg-warning' : 'bg-success');
                
                html += `
                    <div class="report-card" onclick="verDetalle(${r.id})">
                        <div class="d-flex justify-content-between align-items-start">
                            <div class="flex-grow-1">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <h6 class="fw-bold mb-0">${escapeHtml(r.titulo)}</h6>
                                    <small class="text-muted">#${r.id}</small>
                                </div>
                                <p class="small text-muted mb-2">${escapeHtml(r.descripcion.substring(0, 100))}${r.descripcion.length > 100 ? '...' : ''}</p>
                                <div class="d-flex gap-2 flex-wrap">
                                    <span class="badge ${prioridadClass}">${r.prioridad.toUpperCase()}</span>
                                    <span class="badge ${estadoClass}">${estadoText}</span>
                                    <span class="badge bg-secondary">${r.categoria.replace('_', ' ')}</span>
                                </div>
                                <div class="d-flex justify-content-between align-items-center mt-2">
                                    <small class="text-muted"><i class="far fa-calendar-alt"></i> ${new Date(r.fecha_reporte).toLocaleDateString()}</small>
                                    <i class="fas fa-chevron-right text-muted"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
            $('#misReportes').html(html);
        }

        function filtrarReportes(filtro) {
            $('.filter-tab').removeClass('active');
            $(`.filter-tab[data-filtro="${filtro}"]`).addClass('active');
            
            if(filtro === 'todos') {
                mostrarReportes(reportesData);
            } else {
                const filtrados = reportesData.filter(r => r.estado === filtro);
                mostrarReportes(filtrados);
            }
        }

        function verDetalle(id) {
            window.location.href = `detalle.html?id=${id}`;
        }

        function escapeHtml(text) {
            if(!text) return '';
            return $('<div>').text(text).html();
        }

        $(document).ready(function() {
            cargarMisReportes();
        });
    </script>
</body>
</html>
